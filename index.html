<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Gael Stolar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main-header">
      <!-- Parte Superior: Título e Imagen -->
      <div class="top-content">
        <div class="wave-container">
          <h1 class="wave-text">PORTFOLIO</h1>
        </div>
        <h2 style="font-size: 2em">Gael Stolar</h2>
        <img src="gael.jpg" alt="Gael Stolar" class="header-img" />
      </div>

      <!-- Parte Central: Navegación -->
      <nav class="center-nav">
        <ul>
          <li>
            <button>
              <span><a href="#sobre-mi">Sobre MI</a></span>
            </button>
          </li>
          <li>
            <button>
              <span><a href="#proyectos">Proyectos</a></span>
            </button>
          </li>
          <li>
            <button>
              <span><a href="#skills">Skills</a></span>
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- Sobre Mi -->
      <section id="sobre-mi" class="content-section">
        <h2>Sobre Mí</h2>
        <div class="container__sobremi">
          <p>
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Cum,
            alias. Ad qui incidunt quae deleniti eum alias vitae eius quis
            dolorum! Itaque impedit nam illo minima aut amet rem sit.
          </p>
          <img src="image.png" class="card_img" />
        </div>
      </section>

      <!-- Proyectos -->

      <section id="proyectos" class="content-section">
        <h2>Mis Proyectos</h2>
        <div class="container-proyectos">
          <div class="proyect-items"></div>
          <div class="proyect-items"></div>
          <div class="proyect-items"></div>
          <div class="proyect-items"></div>
        </div>
      </section>

      <!-- Skills -->
      <section id="skills" class="content-section">
        <div class="profile__skills-container">
          <h2>SKILLS</h2>
          <ul>
            <li class="profile__skills">
              <span class="profile__skills-name">HTML</span>
              <div class="load-bar">
                <div class="load-bar__bar bar--90"></div>
              </div>
            </li>
            <li class="profile__skills">
              <span class="profile__skills-name">CSS</span>
              <div class="load-bar">
                <div class="load-bar__bar bar--80"></div>
              </div>
            </li>
            <li class="profile__skills">
              <span class="profile__skills-name">JS</span>
              <div class="load-bar">
                <div class="load-bar__bar bar--60"></div>
              </div>
            </li>
            <li class="profile__skills">
              <span class="profile__skills-name">PYTHON</span>
              <div class="load-bar">
                <div class="load-bar__bar bar--50"></div>
              </div>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
